name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# The Nextor dev Docker image supplies the whole toolchain (N80, mknexrom), the
# Nextor SDK and the kernel base files, so CI just runs the build inside it via
# docker-build.sh — no .NET, Nestor80 download, Nextor checkout, mknexrom build
# or kernel-base build needed.
#
# Requirements:
#   * The image must be public (it is pulled without authentication). If it is
#     private, add a `docker/login-action` step before the build using a PAT
#     with `read:packages` (the default GITHUB_TOKEN can't read a package in
#     another repository).
#   * It pulls the `:latest` tag (the newest published image); override it with
#     the NEXTOR_IMAGE env var below to pin a specific version.
env:
  NEXTOR_IMAGE: ghcr.io/konamiman/nextor-dev:latest

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { name: "default",  flag: "",                   base_suffix: "" }
          - { name: "no-undoc", flag: "--variant NO_UNDOC",  base_suffix: ".NO_UNDOC" }

    steps:
      - name: Checkout this driver
        uses: actions/checkout@v4
        with:
          submodules: false

      # The image provides the SDK and kernel base files; docker-build.sh runs
      # `make` inside it, writing the outputs to bin/ owned by the runner user.
      # The ROM build uses the kernel base; the RAM driver (`make ram`) doesn't,
      # but still honours the NO_UNDOC flag that --variant NO_UNDOC sets.
      - name: Build ROM driver (${{ matrix.variant.name }})
        run: ./docker-build.sh --image "$NEXTOR_IMAGE" ${{ matrix.variant.flag }}

      - name: Build RAM driver (${{ matrix.variant.name }})
        run: ./docker-build.sh --image "$NEXTOR_IMAGE" ${{ matrix.variant.flag }} ram

      - name: Confirm both outputs were produced
        run: |
          rom="$(ls bin/Nextor-*.TurboRFDD${{ matrix.variant.base_suffix }}.ROM)"
          drv="$(ls bin/turbofdd${{ matrix.variant.base_suffix }}.drv)"
          [ -s "$rom" ] || { echo "Missing or empty: $rom"; exit 1; }
          [ -s "$drv" ] || { echo "Missing or empty: $drv"; exit 1; }
          echo "OK: $rom"
          echo "OK: $drv"

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: turborfdd-${{ matrix.variant.name }}
          path: |
            bin/Nextor-*.TurboRFDD*.ROM
            bin/turbofdd*.drv
